<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>パパのノート</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ノート">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest-me.webmanifest">
<style>
:root{--bg:#f7f6f9;--fg:#2b2b2e;--muted:#6b6b72;--ac:#5b4a8a}
@media (prefers-color-scheme:dark){:root{--bg:#1c1b20;--fg:#f1f0f4;--muted:#a8a6b0;--ac:#b9a8ea}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;padding:48px 24px;line-height:1.7}
h1{font-size:22px;color:var(--ac);margin:0 0 12px} ol{padding-left:1.3em} p,li{font-size:15px} .s{color:var(--muted);font-size:13px}
a{color:var(--ac);font-weight:700}
</style>
</head>
<body>
<h1>📓 パパのノート</h1>
<p>ホーム画面に専用のアイコンを置くと、開いてすぐ自分だけのページになります。</p>
<ol>
  <li>下の共有ボタン（□に↑）を押す</li>
  <li>「ホーム画面に追加」を選ぶ</li>
  <li>ホーム画面の「ノート」アイコンから開き、パパとしてログイン</li>
</ol>
<p class="s">アイコンから開いたときは、自動でノートに切り替わります。</p>
<p><a href="./?space=me">いまはこのまま開く ›</a></p>
<script>
// launched from the home-screen icon: go straight to the note
if (window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches) location.replace("./?space=me");
</script>
</body>
</html>
